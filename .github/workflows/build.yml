name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: |
          mkdir -p www
          cp index.html bantai.jpg www/
      - run: npx cap add android
      - run: npx cap sync android
      - name: Native code and permissions
        run: |
          cp BantaiPlugin.java MainActivity.java android/app/src/main/java/com/bantai/app/
          cp BantaiBackgroundService.java android/app/src/main/java/com/bantai/app/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent></queries>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n    <application#' $M
          grep -n "SET_ALARM" $M
          ls android/app/src/main/java/com/bantai/app/
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bantai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
