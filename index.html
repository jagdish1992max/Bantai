<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bantai</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#07070d;color:#e8eaf6;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;padding:20px 20px 28px;text-align:center;background:radial-gradient(ellipse at 50% 30%,#1b1033,#07070d 70%);overflow:hidden}
body>*:not(#stage){position:relative;z-index:1}
h1{margin:0 auto auto 0;font-size:18px;letter-spacing:6px;opacity:.8}
#stage{position:fixed;inset:0;z-index:0;touch-action:none}
#stage canvas{width:100%;height:100%;display:block;touch-action:none}
#orb{width:84px;height:84px;font-size:11px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:15px;font-weight:600;
background:radial-gradient(circle at 35% 30%,#67e8f9,#0891b2 55%,#164e63);box-shadow:0 0 40px #06b6d466;transition:.3s}
#orb.on{background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 55%,#92400e);box-shadow:0 0 60px #f59e0b99;animation:p 1.4s infinite}
@keyframes p{50%{transform:scale(1.07)}}
#st{min-height:22px;font-size:14px;color:#9aa4c7}
#tx{text-shadow:0 1px 6px #000;min-height:60px;max-width:420px;font-size:15px;line-height:1.4}
#me{color:#67e8f9}
button.s{background:#14142a;color:#9aa4c7;border:1px solid #2a2a4a;border-radius:10px;padding:10px 16px;font-size:14px}
#cfg{position:fixed!important;left:0;right:0;bottom:12px;margin:0 auto;width:calc(100% - 24px);z-index:9!important;max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;width:100%;max-width:420px;background:#0e0e1c;border:1px solid #2a2a4a;border-radius:14px;padding:16px;text-align:left}
#cfg label{display:block;font-size:12px;color:#9aa4c7;margin:10px 0 4px}
#cfg input[type=text],#cfg input[type=password]{width:100%;padding:10px;border-radius:8px;border:1px solid #2a2a4a;background:#07070d;color:#fff;font-size:14px}
#cfg .r{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<h1>BANTAI</h1>
<div id="stage"></div>
<button id="orb">TAP KAR</button>
<div id="st">Pehle settings mein API key daal</div>
<div id="tx"><div id="me"></div><div id="ai"></div></div>
<button class="s" id="gear">⚙ Settings</button>

<div id="cfg">
  <label>GEMINI API KEY (sirf tere phone mein save hoti hai)</label>
  <input type="password" id="key" placeholder="AIza...">
  <label>MODEL</label>
  <input type="text" id="model">
  <label>VOICE (Charon, Fenrir, Puck, Kore)</label>
  <input type="text" id="voice">
  <div class="r"><span>Wake word "hey bantai" (page khula rakhna)</span><input type="checkbox" id="wake"></div>
  <div class="r"><span>Background mode (screen band hone par bhi sune, sirf APK)</span><input type="checkbox" id="bg"></div>
  <button class="s" id="save" style="margin-top:14px;width:100%">Save</button>
</div>

<script>
const $=id=>document.getElementById(id);
const L=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const W=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const SYS=`Tu Bantai hai, Mumbai ka ek mast tapori dost. Hamesha Hinglish mein bol (Hindi + thoda English), tapori andaaz mein: "apun", "bhidu", "ek number", "kaiko", "bindaas", "chill maar", "faltu ka tension nai lene ka". Jawab chhote rakh, 1-3 line mein, bolne wale andaaz mein. Mazaakiya aur dost jaisa reh, lekin kabhi gaali ya bhadda mazaak nahi. Agar koi seriously pareshan ho to pyaar se aur seedha baat kar. Sahi jawab de, andaze se jhooth mat bol. Tere paas phone control tools hain (torch, alarm, timer, app kholna, call, SMS, WhatsApp, maps, volume, camera). Jab user aisa kuch bole to turant tool use kar aur ek chhote tapori line mein bata de. Call sirf dialer kholta hai, khud call nahi lagata. Number na ho to pooch.`;
const WAKE_RX=/bant(a|aa|ai|ay|aay|ay)i?|बंटाई|बंटाय|बनताई|बांटाई|बंटाइ/i;

$('key').value=L('b_key');
$('model').value=L('b_model')||'gemini-3.8-live';
$('voice').value=L('b_voice')||'Charon';
$('wake').checked=L('b_wake')==='1';
$('bg').checked=L('b_bg')==='1';
if(L('b_key'))$('st').textContent='Tap kar aur bol';

$('gear').onclick=()=>{const c=$('cfg');c.style.display=c.style.display==='block'?'none':'block'};
$('save').onclick=()=>{
  W('b_key',$('key').value.trim());W('b_model',$('model').value.trim()||'gemini-3.8-live');
  W('b_voice',$('voice').value.trim()||'Charon');W('b_wake',$('wake').checked?'1':'0');W('b_bg',$('bg').checked?'1':'0');
  $('cfg').style.display='none';$('st').textContent='Save ho gaya. Tap kar aur bol';
  stopWake();startWake();bgSetup();
};

let an=null,ws=null,ready=false,inCtx=null,outCtx=null,stream=null,node=null,src=null,next=0,sources=[],q=Promise.resolve(),buf=[],bufLen=0;

const TOOLS=[
 {name:'torch',description:'Phone ki torch/flashlight on ya off kare',parameters:{type:'OBJECT',properties:{on:{type:'BOOLEAN',description:'true=on, false=off'}},required:['on']}},
 {name:'set_alarm',description:'Alarm set kare (24 ghante format)',parameters:{type:'OBJECT',properties:{hour:{type:'NUMBER'},minute:{type:'NUMBER'},label:{type:'STRING'}},required:['hour','minute']}},
 {name:'set_timer',description:'Countdown timer set kare',parameters:{type:'OBJECT',properties:{seconds:{type:'NUMBER'},label:{type:'STRING'}},required:['seconds']}},
 {name:'open_app',description:'Phone mein installed app kholna, naam se (jaise YouTube, WhatsApp, Camera)',parameters:{type:'OBJECT',properties:{name:{type:'STRING'}},required:['name']}},
 {name:'call',description:'Number ka dialer kholna (khud call nahi lagata)',parameters:{type:'OBJECT',properties:{number:{type:'STRING'}},required:['number']}},
 {name:'send_sms',description:'SMS likh ke taiyaar kare, user bhejega',parameters:{type:'OBJECT',properties:{number:{type:'STRING'},message:{type:'STRING'}},required:['number']}},
 {name:'send_whatsapp',description:'WhatsApp chat message ke saath khole',parameters:{type:'OBJECT',properties:{number:{type:'STRING'},message:{type:'STRING'}},required:['number']}},
 {name:'open_maps',description:'Maps mein jagah search kare',parameters:{type:'OBJECT',properties:{query:{type:'STRING'}},required:['query']}},
 {name:'set_volume',description:'Media volume percent mein set kare',parameters:{type:'OBJECT',properties:{percent:{type:'NUMBER'}},required:['percent']}},
 {name:'open_camera',description:'Camera kholna',parameters:{type:'OBJECT',properties:{}}}
];
const BR=()=>{const C=window.Capacitor;return (C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Bantai)||null};
async function runTool(n,a){
  const B=BR();
  if(!B)return {error:'Ye sirf Android APK mein chalta hai'};
  const S=v=>String(v==null?'':v);
  let r;
  if(n==='torch')r=await B.torch({on:S(a.on!==false)});
  else if(n==='set_alarm')r=await B.alarm({hour:S(a.hour),minute:S(a.minute),label:S(a.label||'Bantai')});
  else if(n==='set_timer')r=await B.timer({seconds:S(a.seconds),label:S(a.label||'Bantai')});
  else if(n==='open_app')r=await B.openApp({name:S(a.name)});
  else if(n==='call')r=await B.dial({number:S(a.number)});
  else if(n==='send_sms')r=await B.sms({number:S(a.number),message:S(a.message)});
  else if(n==='send_whatsapp')r=await B.whatsapp({number:S(a.number),message:S(a.message)});
  else if(n==='open_maps')r=await B.maps({query:S(a.query)});
  else if(n==='set_volume')r=await B.volume({percent:S(a.percent)});
  else if(n==='open_camera')r=await B.camera({});
  else return {error:'unknown tool'};
  return Object.assign({result:'ok'},r||{});
}

function b64(ab){let s='';const u=new Uint8Array(ab);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}

function play(data){
  if(!outCtx)return;
  const i16=new Int16Array(unb64(data));
  const f=new Float32Array(i16.length);
  for(let i=0;i<i16.length;i++)f[i]=i16[i]/32768;
  const ab=outCtx.createBuffer(1,f.length,24000);ab.copyToChannel(f,0);
  const s=outCtx.createBufferSource();s.buffer=ab;s.connect(an||outCtx.destination);
  const t=Math.max(outCtx.currentTime,next);s.start(t);next=t+ab.duration;
  sources.push(s);s.onended=()=>{sources=sources.filter(x=>x!==s)};
}
function flush(){sources.forEach(s=>{try{s.stop()}catch(e){}});sources=[];next=0}

async function start(){
  if(ws)return;
  const key=L('b_key');
  if(!key){$('cfg').style.display='block';$('st').textContent='Pehle API key daal bhidu';return}
  stopWake();
  {const B1=BR();if(B1)B1.setBusy({on:'true'}).catch(()=>{});}
  $('st').textContent='Connect ho raha hai...';
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    inCtx=new AudioContext({sampleRate:16000});
    outCtx=new AudioContext({sampleRate:24000});
    an=outCtx.createAnalyser();an.fftSize=256;an.connect(outCtx.destination);
    await inCtx.resume();await outCtx.resume();
    const code=`class P extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c){const o=new Int16Array(c.length);for(let k=0;k<c.length;k++){const s=Math.max(-1,Math.min(1,c[k]));o[k]=s<0?s*32768:s*32767}this.port.postMessage(o.buffer,[o.buffer])}return true}}registerProcessor('p',P)`;
    const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
    await inCtx.audioWorklet.addModule(url);
    src=inCtx.createMediaStreamSource(stream);
    node=new AudioWorkletNode(inCtx,'p');
    node.port.onmessage=e=>{
      if(!ready||!ws||ws.readyState!==1)return;
      buf.push(new Int16Array(e.data));bufLen+=buf[buf.length-1].length;
      if(bufLen>=1600){
        const all=new Int16Array(bufLen);let o=0;for(const b of buf){all.set(b,o);o+=b.length}
        buf=[];bufLen=0;
        ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(all.buffer),mimeType:'audio/pcm;rate=16000'}}}));
      }
    };
    src.connect(node);
  }catch(err){
    $('st').textContent='Mic/audio error: '+(err.message||err);cleanup();startWake();return;
  }
  const model=L('b_model')||'gemini-3.8-live';
  ws=new WebSocket('wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key='+encodeURIComponent(key));
  ws.onopen=()=>{
    ws.send(JSON.stringify({setup:{
      model:'models/'+model,
      generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:L('b_voice')||'Charon'}}}},
      systemInstruction:{parts:[{text:SYS}]},
      inputAudioTranscription:{},outputAudioTranscription:{},
      tools:[{functionDeclarations:TOOLS}]
    }}));
  };
  ws.onmessage=e=>{q=q.then(()=>handle(e.data)).catch(()=>{})};
  ws.onerror=()=>{$('st').textContent='Connection error. Key/model/internet check kar'};
  ws.onclose=ev=>{
    const msg=ev.reason?('Band: '+ev.reason):'Session band ho gaya';
    cleanup();$('st').textContent=msg;startWake();
  };
}

async function handle(d){
  if(d instanceof Blob)d=await d.text();
  const m=JSON.parse(d);
  if(m.setupComplete){ready=true;$('orb').classList.add('on');$('orb').textContent='SUN RAHA HOON';$('st').textContent='Bol bindaas!';$('me').textContent='';$('ai').textContent=''}
  if(m.toolCall&&m.toolCall.functionCalls){
    const rs=[];
    for(const f of m.toolCall.functionCalls){
      let r;
      try{r=await runTool(f.name,f.args||{})}catch(e){r={error:String((e&&e.message)||e)}}
      rs.push({id:f.id,name:f.name,response:r});
    }
    if(ws&&ws.readyState===1)ws.send(JSON.stringify({toolResponse:{functionResponses:rs}}));
    return;
  }
  const sc=m.serverContent;if(!sc)return;
  if(sc.interrupted)flush();
  if(sc.modelTurn&&sc.modelTurn.parts)for(const p of sc.modelTurn.parts)if(p.inlineData&&p.inlineData.data)play(p.inlineData.data);
  if(sc.inputTranscription&&sc.inputTranscription.text){
    if(fresh){$('me').textContent='';$('ai').textContent='';fresh=false}
    $('me').textContent+=sc.inputTranscription.text;
  }
  if(sc.outputTranscription&&sc.outputTranscription.text)$('ai').textContent+=sc.outputTranscription.text;
  if(sc.turnComplete)fresh=true;
}
let fresh=false;

function cleanup(){
  ready=false;flush();buf=[];bufLen=0;an=null;
  {const B0=BR();if(B0)B0.setBusy({on:'false'}).catch(()=>{});}
  try{if(ws&&ws.readyState<2)ws.close()}catch(e){}ws=null;
  try{node&&node.disconnect();src&&src.disconnect()}catch(e){}node=null;src=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(inCtx){inCtx.close().catch(()=>{});inCtx=null}
  if(outCtx){outCtx.close().catch(()=>{});outCtx=null}
  $('orb').classList.remove('on');$('orb').textContent='TAP KAR';
}

$('orb').onclick=()=>{ws?cleanup():start()};

let rec=null;
const NSR=()=>{const C=window.Capacitor;return (C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.SpeechRecognition)||null};
let nativeWake=false,nH=[];
const NOPT={language:'hi-IN',maxResults:3,partialResults:true,popup:false};
async function startWakeNative(sr){
  if(nativeWake||L('b_wake')!=='1'||ws)return;
  try{
    const pm=await sr.requestPermissions();
    if(pm&&pm.speechRecognition&&pm.speechRecognition!=='granted'){$('st').textContent='Mic permission allow kar';return}
    nativeWake=true;
    nH.push(await sr.addListener('partialResults',d=>{
      const t=((d&&d.matches)||[]).join(' ');
      if(nativeWake&&WAKE_RX.test(t)){stopWake();start()}
    }));
    nH.push(await sr.addListener('listeningState',e=>{
      if(e&&e.status==='stopped'&&nativeWake&&!ws)setTimeout(()=>{if(nativeWake&&!ws)sr.start(NOPT).catch(()=>{})},400);
    }));
    await sr.start(NOPT);
    $('st').textContent='"Hey bantai" bol, apun sun raha hai';
  }catch(e){nativeWake=false;$('st').textContent='Wake word error: '+(e.message||e)}
}
function startWake(){
  const sr=NSR();if(sr){startWakeNative(sr);return}
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R||L('b_wake')!=='1'||ws||rec)return;
  rec=new R();rec.lang='hi-IN';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';
    if(WAKE_RX.test(t)){stopWake();start()}
  };
  rec.onend=()=>{if(rec&&!ws){try{rec.start()}catch(e){}}};
  rec.onerror=()=>{};
  try{rec.start();$('st').textContent='"Hey bantai" bol, apun sun raha hai'}catch(e){rec=null}
}
function stopWake(){
  if(nativeWake){nativeWake=false;const sr=NSR();nH.forEach(h=>{try{h.remove()}catch(e){}});nH=[];if(sr)sr.stop().catch(()=>{})}
 if(rec){const r=rec;rec=null;r.onend=null;try{r.stop()}catch(e){}}}
async function bgSetup(){
  const B=BR(),sr=NSR();
  if(!B)return;
  if(L('b_bg')==='1'){
    try{
      if(sr){
        const pm=await sr.requestPermissions();
        if(pm&&pm.speechRecognition&&pm.speechRecognition!=='granted'){$('st').textContent='Mic permission allow kar';return}
      }
      const o=await B.overlay({request:'false'});
      if(!o.granted){
        $('st').textContent='"Display over other apps" allow kar, phir wapas aa';
        await B.overlay({request:'true'});
      }
      await B.startWake();
    }catch(e){$('st').textContent='Background error: '+((e&&e.message)||e)}
  }else{
    try{await B.stopWake()}catch(e){}
  }
}
async function checkWake(){
  const B=BR();
  if(!B||ws)return false;
  try{
    const w=await B.consumeWake();
    if(w&&w.wake){stopWake();start();return true}
  }catch(e){}
  return false;
}
document.addEventListener('visibilitychange',async()=>{
  if(document.hidden){stopWake();return}
  if(await checkWake())return;
  if(!ws){stopWake();startWake()}
});
setTimeout(async()=>{
  if(await checkWake())return;
  const B=BR();
  if(B&&L('b_bg')==='1')B.startWake().catch(()=>{});
},1200);
startWake();

/* ===== ANIMATED CHARACTER (image based) ===== */
(function(){
  const cv=document.createElement('canvas');
  cv.style.cssText='width:100%;height:100%;display:block;touch-action:none';
  $('stage').appendChild(cv);
  const ctx=cv.getContext('2d');
  const img=new Image();
  let W=0,H=0,dpr=1,patch=null,skin=['#7b5239','#7b5239'];
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  size();window.addEventListener('resize',size);
  img.onerror=()=>{$('st').textContent='bantai.jpg nahi mili. Repo mein daal'};
  img.onload=()=>{
    try{
      const t=document.createElement('canvas');t.width=t.height=1;
      const tc=t.getContext('2d');
      [[500,301],[585,301]].forEach((q,i)=>{
        tc.drawImage(img,q[0]-3,q[1]-3,6,6,0,0,1,1);
        const d=tc.getImageData(0,0,1,1).data;
        skin[i]='rgb('+d[0]+','+d[1]+','+d[2]+')';
      });
    }catch(e){}
    patch=true;
  };
  img.src='bantai.jpg';

  const sm=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
  const fy=y=>y<=381?0:y<399?sm((y-381)/18):y<=450?1:y<476?1-sm((y-450)/26):0;
  const fx=x=>{const a=Math.abs(x-549);return a<=28?1:a>=68?0:1-sm((a-28)/40)};
  let uy=0,drag=false,lx=0,lv=0,nextBlink=2,lastBlink=-9;
  const data=new Uint8Array(256);
  cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!drag)return;uy+=(e.clientX-lx)*0.008;uy=Math.max(-1,Math.min(1,uy));lx=e.clientX});
  const up=()=>{drag=false};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

  function frame(ts){
    requestAnimationFrame(frame);
    const t=ts/1000;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#07070d';ctx.fillRect(0,0,W,H);
    if(!patch)return;
    let raw=0;
    if(an){
      an.getByteTimeDomainData(data);
      let s=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;s+=v*v}
      raw=Math.min(1,Math.sqrt(s/data.length)*5);
    }
    lv+=(raw-lv)*0.45;
    if(!drag)uy*=0.985;
    const s=Math.max(W/1024,H*0.9/1024)*1.04;
    let ox=W/2-540*s;ox=Math.min(0,Math.max(W-1024*s,ox));
    const br=Math.sin(t*1.3)*0.004;
    ctx.save();
    ctx.translate(ox+540*s+uy*14,700*s);
    ctx.rotate(uy*0.03);
    ctx.scale(1+br,1+br);
    ctx.translate(-540*s,-700*s);
    ctx.scale(s,s);
    ctx.drawImage(img,0,0);
    const d=lv*11;
    if(d>0.3){
      const T=4;
      for(let y=381;y<476;y+=T){
        for(let x=470;x<630;x+=T){
          const fxv=fx(x+T/2);
          if(fxv<=0)continue;
          const d0=d*fxv*fy(y),d1=d*fxv*fy(y+T);
          ctx.drawImage(img,x,y,T,T,x,y+d0,T,T+(d1-d0)+0.5);
        }
      }
      ctx.fillStyle='#2b0d0d';ctx.beginPath();
      ctx.ellipse(549,382+d*0.45,20,d*0.45+0.5,0,0,Math.PI*2);ctx.fill();
    }
    if(t>nextBlink){lastBlink=t;nextBlink=t+2.5+Math.random()*3.5}
    const bp=t-lastBlink,bl=bp>=0&&bp<0.16?Math.sin(bp/0.16*Math.PI):0;
    if(bl>0.05){
      [[500,287],[585,286]].forEach((q,i)=>{
        ctx.save();
        ctx.shadowColor=skin[i];ctx.shadowBlur=3;
        ctx.fillStyle=skin[i];
        ctx.beginPath();ctx.ellipse(q[0],q[1],23,9*bl+0.5,0,0,Math.PI*2);ctx.fill();
        ctx.restore();
        if(bl>0.7){
          ctx.strokeStyle='rgba(20,10,5,0.6)';ctx.lineWidth=1.2;
          ctx.beginPath();ctx.ellipse(q[0],q[1]+1,21,3,0,0,Math.PI);ctx.stroke();
        }
      });
    }
    ctx.restore();
    const g=ctx.createLinearGradient(0,H*0.5,0,H);
    g.addColorStop(0,'rgba(7,7,13,0)');g.addColorStop(0.7,'rgba(7,7,13,0.85)');g.addColorStop(1,'rgba(7,7,13,0.97)');
